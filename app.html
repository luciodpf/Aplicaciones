<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2e1a">
<title>Aplicaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1a0f;
    --bg2: #162216;
    --bg3: #1e2e1e;
    --accent: #7ec850;
    --accent2: #4a8a20;
    --text: #e8f0e0;
    --text2: #9aaa88;
    --text3: #5a6a50;
    --border: #2a3a2a;
    --card: #162216;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .logo {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .logo span {
    color: var(--text2);
    font-weight: 300;
    font-style: italic;
  }

  .sync-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 12px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }

  .sync-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sync-btn.loading .icon { animation: spin 1s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs {
    display: flex;
    gap: 0;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 8px;
    font-size: 12px;
    color: var(--text3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .zona-bar {
    display: flex;
    gap: 6px;
    padding: 8px 0 12px;
  }

  .zona-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text3);
    padding: 5px 14px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .zona-btn.active {
    background: rgba(126,200,80,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }

  .main {
    padding: 16px;
    max-width: 500px;
    margin: 0 auto;
  }

  .stats-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    text-align: center;
  }

  .stat-num {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label {
    font-size: 9px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
  }

  .filter-select {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  .filter-select:focus { outline: none; border-color: var(--accent); }

  .filter-wrap { position: relative; flex: 1; }
  .filter-wrap::after {
    content: '▾';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
    font-size: 10px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 4px;
  }

  .month-btn {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 14px;
    transition: color 0.2s;
  }

  .month-btn:hover { color: var(--accent); }

  .month-label {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    text-transform: capitalize;
  }

  .app-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
  }

  .app-card:active { transform: scale(0.99); }
  .app-card:hover { border-color: var(--accent2); }
  .app-card.expanded { border-color: var(--accent); }

  .card-main {
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .card-date-block {
    background: var(--bg3);
    border-radius: 8px;
    padding: 6px 10px;
    text-align: center;
    min-width: 48px;
    flex-shrink: 0;
  }

  .card-day {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    line-height: 1;
  }

  .card-month-short {
    font-size: 9px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card-info { flex: 1; min-width: 0; }

  .card-campo {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
  }

  .card-lote {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 6px;
  }

  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }

  .tag-has {
    background: rgba(126, 200, 80, 0.12);
    color: var(--accent);
    border: 1px solid rgba(126, 200, 80, 0.25);
  }

  .tag-zona {
    background: rgba(255,255,255,0.04);
    color: var(--text3);
    border: 1px solid var(--border);
  }

  .tag-prod {
    background: rgba(255,255,255,0.04);
    color: var(--text2);
    border: 1px solid var(--border);
  }

  .card-detail {
    display: none;
    border-top: 1px solid var(--border);
    padding: 12px 16px;
  }

  .app-card.expanded .card-detail { display: block; }

  .detail-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text3);
    margin-bottom: 8px;
  }

  .product-row {
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }

  .product-row:last-child { border-bottom: none; }

  .product-view {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .product-view:hover .edit-icon { opacity: 1; }

  .product-name {
    font-size: 12px;
    color: var(--text);
    flex: 1;
  }

  .product-qty {
    font-size: 11px;
    color: var(--accent);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .edit-icon {
    font-size: 10px;
    color: var(--text3);
    opacity: 0.5;
    transition: opacity 0.2s;
  }

  .add-product-btn { margin-top: 8px; }

  .campo-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }

  .campo-chip {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .campo-chip:hover, .campo-chip.selected {
    border-color: var(--accent);
    background: rgba(126, 200, 80, 0.08);
  }

  .campo-chip-name {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
  }

  .campo-chip-count {
    font-size: 10px;
    color: var(--text3);
  }

  .operador-section {
    margin-top: 12px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  .operador-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text3);
    margin-bottom: 8px;
  }

  .operador-btns {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .op-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 7px 12px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .op-btn:hover { border-color: var(--accent2); color: var(--text); }

  .op-btn.selected {
    background: rgba(126,200,80,0.15);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 500;
  }

  .op-stats {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 16px;
  }

  .op-stats-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text3);
    margin-bottom: 10px;
  }

  .op-stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
  }

  .op-stat-name {
    font-size: 12px;
    color: var(--text2);
  }

  .op-stat-has {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--accent);
  }

  .op-stat-empty {
    font-size: 11px;
    color: var(--text3);
    font-style: italic;
  }

  .edit-fecha-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 7px 12px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.2s;
    width: 100%;
    justify-content: center;
  }

  .edit-fecha-btn:hover { border-color: var(--accent); color: var(--accent); }

  .fecha-editor {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .fecha-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
  }

  .fecha-input:focus { outline: none; }

  .fecha-save-btn {
    background: var(--accent2);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .fecha-save-btn:hover { opacity: 0.85; }
  .fecha-cancel-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text3);
    padding: 8px 10px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
  }

  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60vh;
    gap: 16px;
  }

  .loading-logo {
    font-family: 'Fraunces', serif;
    font-size: 36px;
    color: var(--accent);
    opacity: 0;
    animation: fadeIn 0.5s 0.2s forwards;
  }

  .loading-dots {
    display: flex;
    gap: 8px;
  }

  .loading-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }

  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  @keyframes fadeIn { to { opacity: 1; } }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text3);
  }

  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 13px; line-height: 1.6; }

  .error-banner {
    background: rgba(200, 80, 80, 0.15);
    border: 1px solid rgba(200, 80, 80, 0.3);
    color: #e88;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .section-header {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
    margin: 20px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .section-header:first-child { margin-top: 0; }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 8px 14px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    margin-bottom: 16px;
    transition: all 0.2s;
  }

  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  .fab-add {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--accent2);
    color: white;
    border: none;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .fab-add:hover { background: var(--accent); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 300;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    max-height: 88vh;
    overflow-y: auto;
  }

  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
  }

  .form-group { margin-bottom: 14px; }

  .form-label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text3);
    margin-bottom: 6px;
  }

  .producto-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
</style>
</head>
<body>

<div id="loading" class="loading-screen">
  <div class="loading-logo">🌱 Campo</div>
  <div class="loading-dots">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <div class="header-top">
      <div class="logo">Campo <span>aplicaciones</span></div>
      <button class="sync-btn" onclick="syncData()">
        <span class="icon">↻</span> Actualizar
      </button>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="setTab('mes')" id="tab-mes">Este mes</div>
      <div class="tab" onclick="setTab('campo')" id="tab-campo">Por campo</div>
    </div>
    <div class="zona-bar">
      <button class="zona-btn active" onclick="setZona('todas')" id="zona-todas">Todas</button>
      <button class="zona-btn" onclick="setZona('Sur')" id="zona-sur">Sur</button>
      <button class="zona-btn" onclick="setZona('Norte')" id="zona-norte">Norte</button>
    </div>
  </div>

  <div class="main" id="main-content"></div>
</div>

<button class="fab-add" onclick="abrirModalNuevoTrabajo()" title="Nuevo trabajo">+</button>

<div id="modal-nuevo" class="modal-overlay" style="display:none" onclick="if(event.target===this) cerrarModalNuevoTrabajo()">
  <div class="modal-box">
    <div class="modal-title">Nuevo trabajo</div>

    <div class="form-group">
      <label class="form-label">Campo</label>
      <div class="filter-wrap">
        <select class="filter-select" id="nt-campo"></select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Lote</label>
      <input type="text" class="fecha-input" id="nt-lote" placeholder="1" style="width:100%">
    </div>

    <div class="form-group">
      <label class="form-label">Fecha</label>
      <input type="date" class="fecha-input" id="nt-fecha" style="width:100%">
    </div>

    <div class="form-group">
      <label class="form-label">Hectáreas</label>
      <input type="text" class="fecha-input" id="nt-superficie" placeholder="0" style="width:100%">
    </div>

    <div class="form-group">
      <label class="form-label">Productos</label>
      <div id="nt-productos"></div>
      <button type="button" class="edit-fecha-btn" onclick="agregarFilaProductoNT()">+ Agregar otro producto</button>
    </div>

    <div class="form-group">
      <label class="form-label">¿Quién fumigó? (opcional, se puede cargar después)</label>
      <div class="operador-btns" id="nt-operador-btns">
        <button type="button" class="op-btn" onclick="seleccionarOperadorNT('Solo', this)">Solo</button>
        <button type="button" class="op-btn" onclick="seleccionarOperadorNT('+Pato', this)">+ Pato</button>
        <button type="button" class="op-btn" onclick="seleccionarOperadorNT('+Mauri', this)">+ Mauri</button>
        <button type="button" class="op-btn" onclick="seleccionarOperadorNT('+Robertito', this)">+ Robertito</button>
        <button type="button" class="op-btn" onclick="seleccionarOperadorNT('Terceros', this)">Terceros</button>
      </div>
    </div>

    <div id="nt-error" class="error-banner" style="display:none"></div>

    <div class="modal-actions">
      <button type="button" class="fecha-cancel-btn" onclick="cerrarModalNuevoTrabajo()">Cancelar</button>
      <button type="button" class="fecha-save-btn" id="nt-guardar-btn" onclick="guardarNuevoTrabajo()" style="flex:1">Guardar trabajo</button>
    </div>
  </div>
</div>

<script>
const SHEET_ID = '1jfk3SU0AR4aT9po5DtSv4_-GUs9vFnUHGKkBZtdMwqw';
const SHEET_NAME = 'Aplicaciones';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
const CAMPOS_NORTE = ['salera','mondino','bertolini','cibalero','gazano'];

let allData = [];
let currentTab = 'mes';
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let selectedCampo = null;
let currentZona = 'todas';

const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyFgPZi5myG0EfFV4o56WOw5ljewgNNdXHrJBJQJOuwGJOg5ZYitHiIzcCceFTql405Sg/exec';

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_CORTO = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

function getZonaCampo(campo) {
  return CAMPOS_NORTE.includes(campo.toLowerCase()) ? 'Norte' : 'Sur';
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVLine(lines[i]);
    if (cols.length < 8) continue;
    const fechaStr = cols[0]?.replace(/"/g,'').trim();
    if (!fechaStr) continue;
    const fecha = parseDate(fechaStr);
    if (!fecha) continue;
    rows.push({
      fecha,
      fechaStr,
      campo: cols[2]?.replace(/"/g,'').trim() || '',
      lote: cols[3]?.replace(/"/g,'').trim() || '',
      zonaRaw: cols[4]?.replace(/"/g,'').trim() || '',
      get zona() { return this.zonaRaw || getZonaCampo(this.campo); },
      superficie: parseFloat(cols[6]?.replace(/"/g,'').replace(',','.')) || 0,
      insumo: cols[7]?.replace(/"/g,'').trim() || '',
      cantidad: parseFloat(cols[9]?.replace(/"/g,'').replace(',','.')) || 0,
      id: cols[14]?.replace(/"/g,'').trim() || '',
      operador: cols[15]?.replace(/"/g,'').trim() || '',
      fila: i + 1, // fila real en la planilla (1-based, coincide con getRange)
    });
  }
  return rows;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') {
      inQuotes = !inQuotes;
    } else if (line[i] === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += line[i];
    }
  }
  result.push(current);
  return result;
}

function parseDate(str) {
  if (!str) return null;
  const parts = str.split('/');
  if (parts.length === 3) {
    let [d, m, y] = parts;
    if (y.length === 2) y = '20' + y;
    const date = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
    if (!isNaN(date.getTime())) return date;
  }
  return null;
}

function groupApplications(rows) {
  const groups = {};
  for (const row of rows) {
    const key = `${row.fechaStr}||${row.campo}||${row.lote}`;
    if (!groups[key]) {
      groups[key] = {
        fecha: row.fecha,
        fechaStr: row.fechaStr,
        campo: row.campo,
        lote: row.lote,
        zona: row.zona,
        superficie: row.superficie,
        id: row.id,
        operador: row.operador || '',
        productos: []
      };
    }
    if (row.insumo) {
      groups[key].productos.push({ nombre: row.insumo, cantidad: row.cantidad, fila: row.fila });
    }
  }
  return Object.values(groups).sort((a, b) => b.fecha - a.fecha);
}

async function fetchData() {
  const resp = await fetch(CSV_URL);
  if (!resp.ok) throw new Error('No se pudo cargar la planilla');
  const text = await resp.text();
  return parseCSV(text);
}

function renderMes() {
  const filtered = allData.filter(r =>
    r.fecha.getMonth() === currentMonth && r.fecha.getFullYear() === currentYear &&
    (currentZona === 'todas' || r.zona === currentZona)
  );
  const groups = groupApplications(filtered);

  const totalHas = groups.reduce((s, g) => s + g.superficie, 0);
  const totalAplicaciones = groups.length;
  const campos = new Set(groups.map(g => g.campo)).size;

  let html = `
    <div class="month-nav">
      <button class="month-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-label">${MESES[currentMonth]} ${currentYear}</div>
      <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-num">${totalHas.toLocaleString('es-AR', {maximumFractionDigits:0})}</div>
        <div class="stat-label">Hectáreas</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${totalAplicaciones}</div>
        <div class="stat-label">Aplicaciones</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${campos}</div>
        <div class="stat-label">Campos</div>
      </div>
    </div>
  `;

  html += renderStatsOperadores(groups);

  if (groups.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-icon">🌾</div>
      <div class="empty-text">No hay aplicaciones en<br>${MESES[currentMonth]} ${currentYear}</div>
    </div>`;
  } else {
    let lastDate = null;
    for (const g of groups) {
      const dateLabel = `${g.fecha.getDate()} de ${MESES[g.fecha.getMonth()]}`;
      if (dateLabel !== lastDate) {
        html += `<div class="section-header">${dateLabel}</div>`;
        lastDate = dateLabel;
      }
      html += renderCard(g);
    }
  }

  document.getElementById('main-content').innerHTML = html;
}

function renderCampo() {
  if (!selectedCampo) {
    const camposMap = {};
    const dataZona = currentZona === 'todas' ? allData : allData.filter(r => r.zona === currentZona);
    for (const r of dataZona) {
      if (!camposMap[r.campo]) camposMap[r.campo] = 0;
      camposMap[r.campo]++;
    }
    const campos = Object.keys(camposMap).sort();

    let html = `<div class="campo-grid">`;
    for (const c of campos) {
      const count = groupApplications(dataZona.filter(r => r.campo === c)).length;
      html += `<div class="campo-chip" onclick="selectCampo('${c.replace(/'/g,"\\'")}')">
        <div class="campo-chip-name">${c}</div>
        <div class="campo-chip-count">${count} aplic.</div>
      </div>`;
    }
    html += `</div>`;
    document.getElementById('main-content').innerHTML = html;
  } else {
    const filtered = allData.filter(r => r.campo === selectedCampo && (currentZona === 'todas' || r.zona === currentZona));
    const groups = groupApplications(filtered);
    const totalHas = groups.reduce((s, g) => s + g.superficie, 0);

    let html = `
      <button class="back-btn" onclick="selectedCampo=null;render()">← Todos los campos</button>
      <div class="stats-bar" style="grid-template-columns:1fr 1fr;margin-bottom:16px">
        <div class="stat-card">
          <div class="stat-num">${totalHas.toLocaleString('es-AR',{maximumFractionDigits:0})}</div>
          <div class="stat-label">Has. totales</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${groups.length}</div>
          <div class="stat-label">Aplicaciones</div>
        </div>
      </div>
    `;

    let lastMonth = null;
    for (const g of groups) {
      const monthLabel = `${MESES[g.fecha.getMonth()]} ${g.fecha.getFullYear()}`;
      if (monthLabel !== lastMonth) {
        html += `<div class="section-header">${monthLabel}</div>`;
        lastMonth = monthLabel;
      }
      html += renderCard(g);
    }

    document.getElementById('main-content').innerHTML = html;
  }
}

async function guardarFecha(id, saveBtn) {
  const inputId = 'input-fecha-' + id.replace(/[|]/g,'-');
  const input = document.getElementById(inputId);
  if (!input || !input.value) return;

  const [y, m, d] = input.value.split('-');
  const fechaFormateada = `${d}/${m}/${y}`;

  saveBtn.textContent = '...';
  saveBtn.disabled = true;

  try {
    await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ id, fechaNueva: fechaFormateada })
    });
    // Con no-cors no se puede leer la respuesta, asumimos éxito
    const editor = saveBtn.closest('.fecha-editor');
    const card = editor.closest('.app-card');
    editor.remove();
    card.querySelector('.edit-fecha-btn').style.display = 'flex';
    const confirm = document.createElement('div');
    confirm.style.cssText = 'text-align:center;color:var(--accent);font-size:11px;padding:6px 0';
    confirm.textContent = '✓ Fecha actualizada — tocá Actualizar para ver los cambios';
    card.querySelector('.card-detail').appendChild(confirm);
    setTimeout(() => confirm.remove(), 4000);
  } catch(e) {
    alert('No se pudo conectar. Verificá la conexión.');
    saveBtn.textContent = '✓';
    saveBtn.disabled = false;
  }
}

async function guardarOperador(id, operador, btn) {
  const yaSeleccionado = btn.classList.contains('selected');
  const operadorFinal = yaSeleccionado ? '' : operador;

  btn.closest('.operador-btns').querySelectorAll('.op-btn').forEach(b => b.classList.remove('selected'));
  if (!yaSeleccionado) btn.classList.add('selected');

  try {
    await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ id, operador: operadorFinal })
    });
    // Con no-cors no se puede leer la respuesta, asumimos éxito
    for (const row of allData) {
      if (row.id && row.id.toLowerCase() === id.toLowerCase()) {
        row.operador = operadorFinal;
      }
    }
  } catch(e) {
    btn.classList.remove('selected');
    alert('No se pudo guardar. Verificá la conexión.');
  }
}

      body: JSON.stringify({ id, fila, nombreNuevo, cantidadNueva: cantidadNum })

  const [y, m, d] = fechaInput.split('-');
  const fecha = `${d}/${m}/${y}`;

  const superficie = parseFloat(superficieStr) || 0;

  const filasProducto = [...document.querySelectorAll('#nt-productos .producto-input-row')];

    const inputs = row.querySelectorAll('input');
    return { nombre: inputs[0].value.trim(), cantidad: parseFloat(inputs[1].value.trim().replace(',','.')) || 0 };
  }).filter(p => p.nombre);

  if (productos.length === 0) { mostrarErrorNT('Agregá al menos un producto.'); return; }

  const zona = getZonaCampo(campo);
  const id = generarIdNT(campo, lote, fecha);

  const btn = document.getElementById('nt-guardar-btn');
  btn.textContent = 'Guardando...';
  btn.disabled = true;

  try {
    await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        accion: 'crearTrabajo',
        id, fecha, campo, lote, zona, superficie,
        productos,
        operador: ntOperadorSeleccionado
      })
    });
    // Con no-cors no se puede leer la respuesta, asumimos éxito
    cerrarModalNuevoTrabajo();
    alert('✓ Trabajo agregado — tocá Actualizar para verlo en la lista');
  } catch(e) {
    mostrarErrorNT('No se pudo guardar. Verificá la conexión.');
  } finally {
    btn.textContent = 'Guardar trabajo';
    btn.disabled = false;
  }
}

function calcularStatsOperadores(groups) {
  const stats = { 'Solo': 0, '+Pato': 0, '+Mauri': 0, '+Robertito': 0, 'Terceros': 0, 'Sin cargar': 0 };
  for (const g of groups) {
    const op = g.operador || '';
    if (!op) { stats['Sin cargar'] += g.superficie; }
    else if (op === 'Solo') { stats['Solo'] += g.superficie; }
    else if (op === '+Pato') { stats['+Pato'] += g.superficie; }
    else if (op === '+Mauri') { stats['+Mauri'] += g.superficie; }
    else if (op === '+Robertito') { stats['+Robertito'] += g.superficie; }
    else if (op === 'Terceros') { stats['Terceros'] += g.superficie; }
  }
  return stats;
}

function renderStatsOperadores(groups) {
  const stats = calcularStatsOperadores(groups);
  const tieneAlgo = Object.entries(stats).some(([k,v]) => k !== 'Sin cargar' && v > 0);

  if (!tieneAlgo) {
    return `<div class="op-stats">
      <div class="op-stats-title">¿Quién fumigó este mes?</div>
      <div class="op-stat-empty">Todavía no hay operadores cargados</div>
    </div>`;
  }

  let rows = '';
  if (stats['Solo'] > 0) rows += `<div class="op-stat-row"><span class="op-stat-name">Lalo solo</span><span class="op-stat-has">${stats['Solo'].toLocaleString('es-AR')} has</span></div>`;
  if (stats['+Pato'] > 0) rows += `<div class="op-stat-row"><span class="op-stat-name">Con Pato</span><span class="op-stat-has">${stats['+Pato'].toLocaleString('es-AR')} has</span></div>`;
  if (stats['+Mauri'] > 0) rows += `<div class="op-stat-row"><span class="op-stat-name">Con Mauri</span><span class="op-stat-has">${stats['+Mauri'].toLocaleString('es-AR')} has</span></div>`;
  if (stats['+Robertito'] > 0) rows += `<div class="op-stat-row"><span class="op-stat-name">Con Robertito</span><span class="op-stat-has">${stats['+Robertito'].toLocaleString('es-AR')} has</span></div>`;
  if (stats['Terceros'] > 0) rows += `<div class="op-stat-row"><span class="op-stat-name">Terceros</span><span class="op-stat-has">${stats['Terceros'].toLocaleString('es-AR')} has</span></div>`;
  if (stats['Sin cargar'] > 0) rows += `<div class="op-stat-row"><span class="op-stat-name" style="color:var(--text3)">Sin cargar</span><span class="op-stat-has" style="color:var(--text3)">${stats['Sin cargar'].toLocaleString('es-AR')} has</span></div>`;

  return `<div class="op-stats">
    <div class="op-stats-title">Operadores — este mes</div>
    ${rows}
  </div>`;
}

function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
}

function selectCampo(nombre) {
  selectedCampo = nombre;
  render();
}

(async () => {
  try {
    allData = await fetchData();

        <div style="color:#e88;font-size:13px">No se pudo cargar la planilla.<br>Verificá la conexión.</div>
        <button onclick="location.reload()" style="margin-top:16px;background:var(--accent2);color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-family:'DM Mono',monospace">Reintentar</button>
      </div>`;
  }
})();
